<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#fff5de">
<title>Play — Adrian Smith</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display&family=DM+Mono:wght@400;500&family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600;9..40,700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">

<script>try{if(sessionStorage.getItem('pt-from')&&!matchMedia('(prefers-reduced-motion: reduce)').matches){document.documentElement.classList.add('pt-in','pt-bg')}}catch(e){}</script>
</head>
<body class="case-page play-page">
<script>try{sessionStorage.removeItem('pt-from')}catch(e){}</script>

<header class="navbar"><div class="navbar__inner">
  <a class="navbar__logo" href="index.html">[AS]</a>
  <nav class="navbar__tabs" aria-label="Primary">
    <a class="tab tab--work"   href="index.html#work"   aria-label="Work"><img src="assets/tab_work.svg" alt=""></a>
    <a class="tab tab--play"   href="play.html"   aria-label="Play"><img src="assets/tab_play.svg" alt=""></a>
    <a class="tab tab--about"  href="about.html"  aria-label="About"><img src="assets/tab_about.svg" alt=""></a>
    <a class="tab tab--resume" href="resume.html" aria-label="Resume"><img src="assets/tab_resume.svg" alt=""></a>
  </nav>
</div></header>

<main class="case">
  <div class="case__wrap">
    <section class="case__intro pl__intro" aria-labelledby="play-title">
      <h1 class="case__title" id="play-title">Play</h1>
      <p>Miscellaneous motion graphics, posters, and other fun creative projects!</p>
    </section>

    <section class="pl__grid" aria-label="Play projects">
      <div class="pl__row">
        <div class="pl__tile" style="--ar:540/960;--g:0.5625"><video class="pl__media" muted loop playsinline preload="none" poster="assets/play-gracies.jpg" aria-label="Animated Gracie’s hours poster"><source src="assets/play-gracies.mp4" type="video/mp4"></video></div>
        <div class="pl__tile" style="--ar:540/960;--g:0.5625"><video class="pl__media" muted loop playsinline preload="none" poster="assets/play-sanders.jpg" aria-label="Animated tiger walking through a park, for a sandwich shop spot"><source src="assets/play-sanders.mp4" type="video/mp4"></video></div>
        <div class="pl__tile" style="--ar:540/960;--g:0.5625"><video class="pl__media" muted loop playsinline preload="none" poster="assets/play-fall-merch.jpg" aria-label="Animated RIT Campus Store fall merchandise ad with caps on an orange background"><source src="assets/play-fall-merch.mp4" type="video/mp4"></video></div>
      </div>
      <div class="pl__row">
        <div class="pl__tile" style="--ar:1/1;--g:1"><video class="pl__media" muted loop playsinline preload="none" poster="assets/play-pacman.jpg" aria-label="Animated poster grid of colorful geometric patterns with pac-man shapes"><source src="assets/play-pacman.mp4" type="video/mp4"></video></div>
        <div class="pl__tile" style="--ar:800/450;--g:1.7778"><video class="pl__media" muted loop playsinline preload="none" poster="assets/play-startup.jpg" aria-label="Typing animation: “how do i build a startup?”"><source src="assets/play-startup.mp4" type="video/mp4"></video></div>
      </div>
      <div class="pl__row">
        <div class="pl__tile" style="--ar:800/450;--g:1.7778"><video class="pl__media" muted loop playsinline preload="none" poster="assets/play-matrix.jpg" aria-label="Animated grid of tiny symbols forming a shifting image"><source src="assets/play-matrix.mp4" type="video/mp4"></video></div>
        <div class="pl__tile" style="--ar:500/446;--g:1.1211"><video class="pl__media" muted loop playsinline preload="none" poster="assets/play-star.jpg" aria-label="Animated eight-point star badge on navy"><source src="assets/play-star.mp4" type="video/mp4"></video></div>
      </div>
      <div class="pl__row">
        <div class="pl__tile" style="--ar:1000/1000;--g:1.0000"><img class="pl__media" src="assets/play-pool.jpg" alt="Four isometric renders of a palm tree beside a backyard pool" width="1000" height="1000" loading="lazy"></div>
        <div class="pl__tile" style="--ar:600/338;--g:1.7751"><video class="pl__media" muted loop playsinline preload="none" poster="assets/play-wide.jpg" aria-label="Dark abstract motion piece"><source src="assets/play-wide.mp4" type="video/mp4"></video></div>
      </div>
      <div class="pl__row">
        <div class="pl__tile" style="--ar:400/400;--g:1.0000"><video class="pl__media" muted loop playsinline preload="none" poster="assets/play-grad-01.jpg" aria-label="Gradient 01: soft green and blue shapes on a pale background"><source src="assets/play-grad-01.mp4" type="video/mp4"></video></div>
        <div class="pl__tile" style="--ar:400/400;--g:1.0000"><video class="pl__media" muted loop playsinline preload="none" poster="assets/play-grad-02.jpg" aria-label="Gradient 02: dark poster with a checkered logo"><source src="assets/play-grad-02.mp4" type="video/mp4"></video></div>
        <div class="pl__tile" style="--ar:400/400;--g:1.0000"><video class="pl__media" muted loop playsinline preload="none" poster="assets/play-grad-03.jpg" aria-label="Gradient 03: glowing pastel blobs on a blue, pink and yellow gradient"><source src="assets/play-grad-03.mp4" type="video/mp4"></video></div>
      </div>
      <div class="pl__row">
        <div class="pl__tile" style="--ar:16/9;--g:1.7778"><video class="pl__media" muted loop playsinline preload="none" poster="assets/play-drpepper.jpg" aria-label="Animated Dr Pepper spot"><source src="assets/play-drpepper.mp4" type="video/mp4"></video></div>
        <div class="pl__tile" style="--ar:16/9;--g:1.7778"><video class="pl__media" muted loop playsinline preload="none" poster="assets/play-sandisk.jpg" aria-label="Animated SanDisk spot"><source src="assets/play-sandisk.mp4" type="video/mp4"></video></div>
        <div class="pl__tile" style="--ar:16/9;--g:1.7778"><video class="pl__media" muted loop playsinline preload="none" poster="assets/play-playstation.jpg" aria-label="Animated PlayStation render"><source src="assets/play-playstation.mp4" type="video/mp4"></video></div>
      </div>
    </section>
  </div>
</main>

<footer class="footer">
  <img class="footer__wave" src="assets/footer-wave.svg" alt="">
  <div class="footer__inner">
    <h2 class="footer__title">Do you like what you see?</h2>

      <a href="https://vimeo.com/adriansdesign" target="_blank" rel="noopener">Vimeo</a>
      <a href="mailto:e.adriansdesign@gmail.com">Email</a>
    </nav>
    <p class="footer__copy">© 2026</p>
  </div>
</footer>

<script src="site.js"></script>
</body>
</html>
